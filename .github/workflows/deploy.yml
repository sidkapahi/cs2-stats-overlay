name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          VITE_LEETIFY_KEY: ${{ secrets.VITE_LEETIFY_KEY }}
          # Public URL of the Leetify proxy Worker (worker/leetify-proxy.js).
          # Leetify's public API sends no CORS headers, so the browser can't call
          # it directly — this Worker is what makes Premier mode work in a browser.
          # Not a secret, so a repository variable is the natural home.
          VITE_LEETIFY_PROXY_URL: ${{ vars.VITE_LEETIFY_PROXY_URL || secrets.VITE_LEETIFY_PROXY_URL }}
          # Public URL of the optional Steam avatar proxy Worker (worker/README.md).
          # Not a secret, so a repository variable is the natural home, but a
          # secret with the same name works too.
          VITE_AVATAR_PROXY_URL: ${{ vars.VITE_AVATAR_PROXY_URL || secrets.VITE_AVATAR_PROXY_URL }}
          # Public URLs of the optional live-status proxy Workers (one per
          # platform — separate Workers from the avatar proxy, see
          # worker/README.md). Also not secrets, so repository variables are the
          # natural home. Any left unset disables that platform's live check.
          VITE_TWITCH_PROXY_URL: ${{ vars.VITE_TWITCH_PROXY_URL || secrets.VITE_TWITCH_PROXY_URL }}
          VITE_YOUTUBE_PROXY_URL: ${{ vars.VITE_YOUTUBE_PROXY_URL || secrets.VITE_YOUTUBE_PROXY_URL }}
          VITE_KICK_PROXY_URL: ${{ vars.VITE_KICK_PROXY_URL || secrets.VITE_KICK_PROXY_URL }}
          # Public URL of the FACEIT proxy Worker (worker/faceit-proxy.js) —
          # required for FACEIT mode. Not a secret, so a repository variable is
          # the natural home, but a secret with the same name works too.
          VITE_FACEIT_PROXY_URL: ${{ vars.VITE_FACEIT_PROXY_URL || secrets.VITE_FACEIT_PROXY_URL }}
          # PostHog analytics — the project key is a public, write-only
          # identifier, so a repository variable is the natural home (a secret
          # works too). VITE_POSTHOG_HOST selects the US/EU region.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY || secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
