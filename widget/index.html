<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Stats Overlay</title>
  <!-- No analytics tag here. The overlay is not page-tracked; the previous
       fork's Plausible + Cloudflare tags were removed so no data flows to
       another account. The widget loads Umami in manual mode (see
       src/shared/analytics.ts) to fire only explicit events — overlay_active
       (retention), twitch_session_started (live sessions), overlay_error
       (reliability) — with no automatic pageviews. -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/widget/widget.ts"></script>
</body>
</html>
